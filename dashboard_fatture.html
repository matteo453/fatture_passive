<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Fatture Passive</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; color: #1a1a1a; font-size: 14px; }
  .header { background: #fff; border-bottom: 1px solid #e5e5e0; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header .meta { font-size: 12px; color: #888; margin-top: 2px; }
  .container { max-width: 1400px; margin: 0 auto; padding: 20px 24px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi { background: #fff; border-radius: 10px; padding: 16px; border: 1px solid #e5e5e0; }
  .kpi .lbl { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .kpi .val { font-size: 24px; font-weight: 700; color: #1a1a1a; }
  .charts-row { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 20px; }
  @media (max-width: 900px) { .charts-row { grid-template-columns: 1fr; } }
  .card { background: #fff; border-radius: 10px; border: 1px solid #e5e5e0; padding: 20px; }
  .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 16px; color: #333; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; align-items: center; }
  .filters input, .filters select { padding: 8px 12px; border: 1px solid #e0e0da; border-radius: 8px; font-size: 13px; background: #fafaf8; color: #1a1a1a; outline: none; }
  .filters input:focus, .filters select:focus { border-color: #378ADD; }
  .filters input { flex: 1; min-width: 200px; }
  .count-tag { font-size: 12px; color: #888; background: #f0f0ea; padding: 4px 10px; border-radius: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.4px; padding: 8px 10px; border-bottom: 1px solid #e5e5e0; text-align: left; white-space: nowrap; }
  td { padding: 9px 10px; border-bottom: 1px solid #f0f0ea; font-size: 13px; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafaf8; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; background: #E6F1FB; color: #185FA5; }
  .badge-gray { background: #f0f0ea; color: #666; }
  .amount { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
  .truncate { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pager { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 12px; color: #888; }
  .pager button { padding: 5px 12px; border: 1px solid #e0e0da; border-radius: 6px; background: #fff; cursor: pointer; font-size: 12px; }
  .pager button:hover { background: #f5f5f0; }
  .pager button:disabled { opacity: 0.4; cursor: not-allowed; }
  .loading { text-align: center; padding: 60px; color: #888; }
  .spinner { width: 32px; height: 32px; border: 3px solid #e5e5e0; border-top-color: #378ADD; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { background: #FCEBEB; color: #A32D2D; padding: 16px 20px; border-radius: 10px; margin-bottom: 20px; font-size: 13px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #555; }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .due-warning { color: #BA7517; font-weight: 600; }
  .due-overdue { color: #A32D2D; font-weight: 600; }
  .reload-btn { padding: 7px 14px; background: #378ADD; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; }
  .reload-btn:hover { background: #185FA5; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>📋 Fatture Passive — Cantieri</h1>
    <div class="meta" id="meta-info">Caricamento...</div>
  </div>
  <button class="reload-btn" onclick="loadData()">⟳ Aggiorna</button>
</div>

<div class="container">
  <div id="error-box" style="display:none" class="error"></div>
  <div id="debug-box" style="display:none;background:#fffbe6;border:1px solid #f0d080;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:12px;line-height:1.8;color:#444"></div>
  <div id="root"><div class="loading"><div class="spinner"></div>Recupero dati dal foglio Google...</div></div>
</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS7CrgavtKZ1lfDpoU0_ydZ4_5LMEGELUn00y0Ve62pm0NGCS353e0ZWzyUT3M5BhKEVgq9oHX1-3Wn/pub?output=csv&gid=1367053986';
const COLORS = ['#378ADD','#1D9E75','#BA7517','#D4537E','#639922','#D85A30','#7F77DD','#E24B4A','#0F6E56','#633806'];

let allData = [], filteredData = [], page = 1, pageSize = 25;
let barChart = null, pieChart = null;

function isValidCantiere(val) {
  return true; // teniamo tutte le righe
}

function getCantiereLabel(val) {
  if (!val || val.trim() === '' || ['N/A','NA','NULL','NONE','UNDEFINED'].includes((val||'').trim().toUpperCase())) {
    return 'Non assegnato';
  }
  return val.trim();
}

function parseNum(n) {
  if (!n && n !== 0) return 0;
  const s = String(n).trim().replace(/[^\d,.-]/g, "");
  if (s.includes(".") && s.includes(",")) return parseFloat(s.replace(/\./g, "").replace(",", ".")) || 0;
  if (s.includes(",")) return parseFloat(s.replace(",", ".")) || 0;
  return parseFloat(s) || 0;
}

function fmtEur(n) {
  const num = parseNum(n);
  return new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 2 }).format(num);
}

function fmtDate(s) {
  if (!s) return '—';
  try { return new Date(s).toLocaleDateString('it-IT'); } catch { return s; }
}

function isOverdue(dateStr) {
  if (!dateStr) return false;
  return new Date(dateStr) < new Date();
}

async function loadData() {
  document.getElementById('root').innerHTML = '<div class="loading"><div class="spinner"></div>Recupero dati dal foglio Google...</div>';
  document.getElementById('error-box').style.display = 'none';

  try {
    const res = await fetch(CSV_URL, { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' — verifica che il foglio sia pubblico.');
    const text = await res.text();
    if (!text || text.trim().length < 10) throw new Error('Il foglio è vuoto o non accessibile.');

    const results = Papa.parse(text, {
      header: true,
      skipEmptyLines: true,
      transformHeader: h => h.trim().toLowerCase().replace(/\s+/g,'_')
    });

    if (results.data.length === 0) throw new Error('Nessun dato trovato nel foglio.');

    // Normalizza rc_center su tutte le righe
    allData = results.data.map(r => ({ ...r, rc_center: getCantiereLabel(r['rc_center']) }));

    document.getElementById('debug-box').style.display = 'none';
    document.getElementById('meta-info').textContent =
      'Aggiornato: ' + new Date().toLocaleString('it-IT') +
      '  ·  ' + allData.length + ' fatture caricate';
    render();
  } catch (err) {
    showError(err.message);
  }
}

function showError(msg) {
  document.getElementById('error-box').style.display = 'block';
  document.getElementById('error-box').textContent = '⚠ ' + msg;
  document.getElementById('root').innerHTML = '';
}

function getCantieri() {
  const all = [...new Set(allData.map(r => r['rc_center']))].sort();
  return all.sort((a, b) => {
    if (a === 'Non assegnato') return 1;
    if (b === 'Non assegnato') return -1;
    return a.localeCompare(b);
  });
}

function applyFilters() {
  const q = (document.getElementById('fq') || {value:''}).value.toLowerCase();
  const cc = (document.getElementById('fcc') || {value:''}).value;
  const sort = (document.getElementById('fsort') || {value:'date_desc'}).value;
  filteredData = allData.filter(r => {
    if (cc && r['rc_center'] !== cc) return false;
    if (q) {
      const haystack = [r['supplier_name'], r['description'], r['rc_center'], r['doc_id']].join(' ').toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });
  filteredData.sort((a, b) => {
    if (sort === 'date_desc') return new Date(b['date'] || 0) - new Date(a['date'] || 0);
    if (sort === 'date_asc')  return new Date(a['date'] || 0) - new Date(b['date'] || 0);
    if (sort === 'amount_desc') return parseNum(b['amount_gross']) - parseNum(a['amount_gross']);
    if (sort === 'amount_asc')  return parseNum(a['amount_gross']) - parseNum(b['amount_gross']);
    return 0;
  });
  page = 1;
}

function kpiData() {
  const total = allData.reduce((s, r) => s + parseNum(r['amount_gross']), 0);
  const cantieri = new Set(allData.map(r => r['rc_center'])).size;
  const fornitori = new Set(allData.map(r => r['supplier_name'])).size;
  const scadute = allData.filter(r => isOverdue(r['next_due_date'])).length;
  return { total, cantieri, fornitori, count: allData.length, scadute };
}

function barData() {
  const map = {};
  allData.forEach(r => {
    const c = r['rc_center'];
    map[c] = (map[c] || 0) + parseNum(r['amount_gross']);
  });
  const sorted = Object.entries(map).sort((a,b) => b[1]-a[1]);
  return { labels: sorted.map(x => x[0]), values: sorted.map(x => Math.round(x[1])) };
}

function pieData() {
  const map = {};
  allData.forEach(r => {
    const s = (r['supplier_name'] || 'Altro').trim();
    map[s] = (map[s] || 0) + parseNum(r['amount_gross']);
  });
  const sorted = Object.entries(map).sort((a,b) => b[1]-a[1]);
  const top = sorted.slice(0, 9);
  const other = sorted.slice(9).reduce((s,x) => s+x[1], 0);
  if (other > 0) top.push(['Altri', other]);
  return { labels: top.map(x => x[0]), values: top.map(x => Math.round(x[1])) };
}

function render() {
  applyFilters();
  const kpi = kpiData();
  const cantieri = getCantieri();
  const bd = barData();
  const pd = pieData();
  const pageData = filteredData.slice((page-1)*pageSize, page*pageSize);
  const totalPages = Math.max(1, Math.ceil(filteredData.length / pageSize));
  const currentFilters = {
    q: (document.getElementById('fq')||{value:''}).value,
    cc: (document.getElementById('fcc')||{value:''}).value,
    sort: (document.getElementById('fsort')||{value:'date_desc'}).value
  };

  document.getElementById('root').innerHTML = `
<div class="kpis">
  <div class="kpi"><div class="lbl">Fatture totali</div><div class="val">${kpi.count.toLocaleString('it-IT')}</div></div>
  <div class="kpi"><div class="lbl">Importo totale</div><div class="val" style="font-size:18px">${fmtEur(kpi.total)}</div></div>
  <div class="kpi"><div class="lbl">Cantieri attivi</div><div class="val">${kpi.cantieri}</div></div>
  <div class="kpi"><div class="lbl">Fornitori unici</div><div class="val">${kpi.fornitori}</div></div>
  <div class="kpi"><div class="lbl">Fatture scadute</div><div class="val" style="color:${kpi.scadute>0?'#A32D2D':'#3B6D11'}">${kpi.scadute}</div></div>
</div>

<div class="charts-row">
  <div class="card">
    <h2>Spesa totale per cantiere (€)</h2>
    <div style="position:relative;width:100%;height:${Math.max(220, bd.labels.length*34+60)}px">
      <canvas id="barChart"></canvas>
    </div>
  </div>
  <div class="card">
    <h2>Top fornitori per importo</h2>
    <div class="legend" id="pie-legend"></div>
    <div style="position:relative;width:100%;height:240px">
      <canvas id="pieChart"></canvas>
    </div>
  </div>
</div>

<div class="card">
  <h2>Dettaglio fatture</h2>
  <div class="filters">
    <input id="fq" type="search" placeholder="Cerca fornitore, descrizione, cantiere..." value="${currentFilters.q}">
    <select id="fcc">
      <option value="">Tutti i cantieri</option>
      ${cantieri.map(c => `<option value="${c}"${currentFilters.cc===c?' selected':''}>${c}</option>`).join('')}
    </select>
    <select id="fsort">
      <option value="date_desc"${currentFilters.sort==='date_desc'?' selected':''}>Data ↓</option>
      <option value="date_asc"${currentFilters.sort==='date_asc'?' selected':''}>Data ↑</option>
      <option value="amount_desc"${currentFilters.sort==='amount_desc'?' selected':''}>Importo ↓</option>
      <option value="amount_asc"${currentFilters.sort==='amount_asc'?' selected':''}>Importo ↑</option>
    </select>
    <span class="count-tag">${filteredData.length} risultati</span>
  </div>
  <div style="overflow-x:auto">
  <table>
    <thead><tr>
      <th>Data</th>
      <th>Scadenza</th>
      <th>Fornitore</th>
      <th>Cantiere</th>
      <th>Descrizione</th>
      <th style="text-align:right">Netto</th>
      <th style="text-align:right">IVA</th>
      <th style="text-align:right">Lordo</th>
    </tr></thead>
    <tbody>
    ${pageData.length === 0
      ? '<tr><td colspan="8" style="text-align:center;color:#888;padding:30px">Nessuna fattura trovata</td></tr>'
      : pageData.map(r => {
          const overdue = isOverdue(r['next_due_date']);
          return `<tr>
            <td style="white-space:nowrap">${fmtDate(r['date'])}</td>
            <td class="${overdue ? 'due-overdue' : ''}" style="white-space:nowrap">${fmtDate(r['next_due_date'])}</td>
            <td class="truncate" title="${r['supplier_name']||''}">${r['supplier_name']||'—'}</td>
            <td><span class="badge${r['rc_center']==='Non assegnato'?' badge-gray':''}">${r['rc_center']}</span></td>
            <td class="truncate" style="color:#666" title="${r['description']||''}">${r['description']||'—'}</td>
            <td class="amount">${fmtEur(r['amount_net'])}</td>
            <td class="amount" style="color:#888">${fmtEur(r['amount_vat'])}</td>
            <td class="amount" style="font-weight:700">${fmtEur(r['amount_gross'])}</td>
          </tr>`;
        }).join('')}
    </tbody>
  </table>
  </div>
  <div class="pager">
    <button onclick="_prevPage()" ${page<=1?'disabled':''}>← Prec</button>
    <span>Pagina ${page} di ${totalPages}</span>
    <button onclick="_nextPage()" ${page>=totalPages?'disabled':''}>Succ →</button>
    <span style="margin-left:auto">Mostrando ${(page-1)*pageSize+1}–${Math.min(page*pageSize, filteredData.length)} di ${filteredData.length}</span>
  </div>
</div>`;

  // Wire up filter events
  document.getElementById('fq').addEventListener('input', () => render());
  document.getElementById('fcc').addEventListener('change', () => render());
  document.getElementById('fsort').addEventListener('change', () => render());

  // Destroy old charts
  if (barChart) { barChart.destroy(); barChart = null; }
  if (pieChart)  { pieChart.destroy();  pieChart = null; }

  // Bar chart
  barChart = new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
      labels: bd.labels,
      datasets: [{ label: 'Importo lordo', data: bd.values, backgroundColor: '#378ADD', borderWidth: 0, borderRadius: 4 }]
    },
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ' ' + fmtEur(ctx.raw) } } },
      scales: {
        x: { ticks: { callback: v => fmtEur(v), font: { size: 11 } }, grid: { color: 'rgba(0,0,0,0.05)' } },
        y: { ticks: { font: { size: 12 } } }
      }
    }
  });

  // Pie chart legend
  document.getElementById('pie-legend').innerHTML = pd.labels.map((l,i) =>
    `<div class="legend-item"><div class="legend-dot" style="background:${COLORS[i%COLORS.length]}"></div><span title="${l}">${l.length>20?l.slice(0,20)+'…':l}</span></div>`
  ).join('');

  // Pie chart
  pieChart = new Chart(document.getElementById('pieChart'), {
    type: 'doughnut',
    data: {
      labels: pd.labels,
      datasets: [{ data: pd.values, backgroundColor: COLORS, borderWidth: 2, borderColor: '#fff' }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${fmtEur(ctx.raw)}` } }
      }
    }
  });
}

function _prevPage() { if (page > 1) { page--; const f = filteredData; render(); filteredData = f; document.getElementById('root').scrollIntoView(); } }
function _nextPage() { const t = Math.ceil(filteredData.length/pageSize); if (page < t) { page++; const f = filteredData; render(); filteredData = f; } }

window._prevPage = _prevPage;
window._nextPage = _nextPage;

loadData();
</script>
</body>
</html>
